<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Food Order Form</title>
    <style>
      div {
        margin: 10px 5px;
      }
    </style>
  </head>

  <body>
    <h1>Customer Food Order Form</h1>

    <p>
      Welcome to our food ordering page! Please enter your name, select your
      preferred food option, and provide any allergy information before
      submitting your order.
    </p>

    <form action="#" method="post">
      <div>
        <label for="firstName">First Name:</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          minlength="2"
          maxlength="30"
          required
        />
      </div>

      <div>
        <label for="lastName">Last Name:</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          minlength="2"
          maxlength="30"
          required
        />
      </div>

      <div>
        <label for="foodChoice">Food Preference:</label>
        <select id="foodChoice" name="foodChoice" required>
          <option value="">-- Select a food option --</option>
          <option value="chicken">Chicken</option>
          <option value="beef">Beef</option>
          <option value="fish">Fish</option>
        </select>
      </div>

      <div>
        <label for="allergies">Allergy Information:</label>

        <br />

        <textarea
          id="allergies"
          name="allergies"
          rows="5"
          cols="40"
          placeholder="List any food allergies here. If none, leave blank."
        ></textarea>
      </div>

      <div><button type="submit">Send Order</button></div>
    </form>

    <br />

    <p>
      Need more information about food allergies? Visit the
      <a
        href="https://www.foodallergy.org/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Food Allergy Research & Education website </a
      >.
    </p>
  </body>
</html>
